services:
  - type: web
    name: profitpilot-ai-pro-backend
    runtime: python
    plan: free

    rootDir: backend

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: "3.11"

      - key: MONGODB_URI
        sync: false

      - key: JWT_SECRET_KEY
        sync: false

      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"

      - key: ALGORITHM
        value: "HS256"
